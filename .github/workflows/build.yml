name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/MacDock/MacDock.csproj -r win-x64

      - name: Publish (self-contained, single-file, win-x64)
        run: >
          dotnet publish src/MacDock/MacDock.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -o dist

      - name: Đóng gói
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath MacDock-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDock-win-x64
          path: MacDock-win-x64.zip

      - name: Release (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MacDock-win-x64.zip
          generate_release_notes: true
